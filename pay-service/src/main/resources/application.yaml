server:
  port: 8086
spring:
  application:
    name: pay-service
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://${hm.db.host}:3306/hm-pay?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${hm.db.pw}
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
  rabbitmq:
    host: 127.0.0.1 # 你的虚拟机IP​
    port: 5672 # 端口​
    virtual-host: /mall # 虚拟主机​
    username: mall # 用户名​
    password: 123 # 密码
    publisher-confirm-type: correlated # 生产者确认：消息到达broker后回调确认（ConfirmCallback）
    publisher-returns: true # 消息路由失败时回调（ReturnsCallback），需配合mandatory
    listener:
      simple:
        acknowledge-mode: manual # 消费者手动确认（basicAck/basicNack）
        retry:
          enabled: true # 消费异常重试
          initial-interval: 1000ms
          multiplier: 2 # 重试间隔倍数
          max-attempts: 3 # 重试3次仍失败，消息被拒收并进入死信队列
logging:
  level:
    com.hmall: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
knife4j:
  enable: true
  openapi:
    title: 支付服务接口文档
    description: "支付服务接口文档"
    email: zhanghuyi@itcast.cn
    concat: 虎哥
    url: https://www.itcast.cn
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.hmall.pay.controller
